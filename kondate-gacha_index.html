<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="献立ガチャポン">
<title>献立ガチャポン！</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:linear-gradient(160deg,#fff9f0 0%,#fff0f5 50%,#f0f5ff 100%);min-height:100vh;-webkit-tap-highlight-color:transparent;}
.app{padding:1.5rem 1rem 3rem;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:480px;margin:0 auto;}
.hdr{text-align:center;padding:0.5rem 0;}
.hdr h1{font-size:26px;font-weight:900;letter-spacing:1px;font-style:normal;background:linear-gradient(135deg,#ff6bae,#ffb347,#5ecf7a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr p{font-size:13px;color:#aaa;margin-top:4px;}
.toggle{display:flex;background:#f0e8f0;border-radius:40px;padding:4px;width:100%;max-width:320px;gap:4px;}
.tbtn{flex:1;padding:10px 0;border:none;background:transparent;border-radius:36px;font-size:14px;font-weight:700;color:#aaa;cursor:pointer;transition:all 0.2s;}
.tbtn.on{background:#ff6bae;color:#fff;}
.ing-area{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;}
.ing-row{display:flex;gap:8px;}
.ing-row input{flex:1;padding:11px 14px;border-radius:22px;border:1.5px solid #f0d0e8;background:#fff;font-size:15px;color:#333;outline:none;-webkit-appearance:none;}
.ing-row input:focus{border-color:#ff6bae;}
.addbtn{padding:11px 18px;border-radius:22px;border:none;background:#ff6bae;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;}
.tag{display:flex;align-items:center;gap:4px;padding:5px 11px 5px 13px;background:#fff0f8;border:1px solid #f4c0d1;border-radius:20px;font-size:13px;color:#993556;}
.tdel{cursor:pointer;font-size:15px;color:#d4537e;background:none;border:none;padding:0;line-height:1;}
.nomatch{font-size:13px;color:#bbb;text-align:center;padding:6px 0;}
.cards{width:100%;display:flex;flex-direction:column;gap:12px;}
.clabel{font-size:12px;font-weight:700;color:#ccc;letter-spacing:0.5px;margin-bottom:4px;padding-left:6px;}
.side-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.card{background:#fff;border-radius:22px;padding:1rem;border:1.5px solid #f0e0f0;min-height:108px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.1s;-webkit-tap-highlight-color:transparent;}
.card:active{transform:scale(0.97);}
.card.rev{animation:rev 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;}
@keyframes rev{0%{transform:scale(0.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
.card.expanded{border-color:#ff6bae;background:#fff8fc;}
.cej{font-size:32px;margin-bottom:5px;display:block;}
.cnm{font-size:15px;font-weight:700;color:#333;margin-bottom:3px;line-height:1.3;}
.cnm-main{font-size:18px;}
.cbdg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
.b{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.bq{background:#fff0f0;color:#c03030;}
.bk{background:#efffef;color:#1a8a1a;}
.bi{background:#fff8e0;color:#c07800;}
.cnt{font-size:11px;color:#bbb;margin-top:5px;}
.cmt{font-size:11px;color:#cc4488;margin-top:5px;font-weight:700;}
.cph{font-size:14px;color:#ccc;}
.detail{margin-top:10px;border-top:1px dashed #f4c0d1;padding-top:10px;width:100%;text-align:left;}
.detail-title{font-size:11px;font-weight:700;color:#cc4488;margin-bottom:6px;}
.detail-section{margin-bottom:7px;}
.detail-label{font-size:10px;color:#bbb;font-weight:700;margin-bottom:4px;}
.detail-items{display:flex;flex-wrap:wrap;gap:4px;}
.detail-tag{padding:3px 8px;border-radius:12px;font-size:11px;}
.detail-ing{background:#e8f4ff;color:#1a5a9a;}
.detail-sea{background:#f0ecff;color:#4a3489;}
.tap-hint{font-size:10px;color:#e0b8d0;margin-top:6px;}
.gbtn{width:100%;max-width:300px;padding:1rem 1.5rem;border-radius:50px;border:none;background:linear-gradient(135deg,#ff6bae,#ffb347);color:#fff;font-size:18px;font-weight:900;font-style:normal;cursor:pointer;transition:transform 0.1s;-webkit-tap-highlight-color:transparent;}
.gbtn:active{transform:scale(0.96);}
.gbtn:disabled{opacity:0.5;cursor:default;}
.rrow{display:flex;gap:8px;width:100%;max-width:320px;}
.rbtn{flex:1;padding:10px 4px;border-radius:30px;border:1.5px solid #f0d0e8;background:#fff;font-size:12px;color:#cc4488;cursor:pointer;font-weight:700;text-align:center;-webkit-tap-highlight-color:transparent;}
.rbtn:active{background:#fff0f8;}
.rbtn:disabled{opacity:0.35;cursor:default;}
.tips{font-size:12px;color:#ccc;text-align:center;}
.spn{font-size:26px;display:inline-block;animation:sp 0.4s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">

<div class="hdr">
  <h1>🎰 献立ガチャポン！</h1>
  <p>タップしてメニューを決めちゃおう！</p>
</div>

<div class="toggle">
<button class="tbtn on" id="brnd" onclick="setMode('r')">🎲 ランダム</button>
<button class="tbtn" id="bing" onclick="setMode('i')">🧊 食材から探す</button>
</div>

<div class="ing-area" id="iarea" style="display:none">
<div class="ing-row">
<input type="text" id="iinput" placeholder="例：鶏肉、卵、じゃがいも…" onkeydown="if(event.key==='Enter')addIng()"/>
<button class="addbtn" onclick="addIng()">追加</button>
</div>
<div class="tags" id="tagbox"></div>
<div class="nomatch" id="nomatch" style="display:none">一致するメニューが見つかりません 😢</div>
</div>

<div class="cards">
<div><div class="clabel">🍲 主菜</div><div class="card" id="mc" onclick="toggleDetail('mc')"><span class="cph">ガチャを回してね！</span></div></div>
<div>
  <div class="clabel">🥗 副菜</div>
  <div class="side-pair">
    <div class="card" id="sc1" onclick="toggleDetail('sc1')"><span class="cph">副菜①</span></div>
    <div class="card" id="sc2" onclick="toggleDetail('sc2')"><span class="cph">副菜②</span></div>
  </div>
</div>
</div>

<button class="gbtn" id="gbtn" onclick="roll()">🎰 ガチャを回す！</button>
<div class="rrow">
<button class="rbtn" id="rm" onclick="reroll('m')" disabled>🔄 主菜</button>
<button class="rbtn" id="rs1" onclick="reroll('s1')" disabled>🔄 副菜①</button>
<button class="rbtn" id="rs2" onclick="reroll('s2')" disabled>🔄 副菜②</button>
</div>
<p class="tips">⏱ 時短=30分以内　👶 子どもOK　タップで材料表示</p>
</div>

<script>
const MM=[
{n:"鶏の唐揚げ",e:"🍗",t:"時短",k:true,d:"冷凍唐揚げ活用OK",i:["鶏もも肉","醤油","にんにく","生姜"],s:["醤油","みりん","酒","片栗粉","塩","こしょう"]},
{n:"肉じゃが",e:"🥔",t:"時短",k:true,d:"電子レンジで時短",i:["じゃがいも","玉ねぎ","豚肉","にんじん"],s:["醤油","みりん","砂糖","酒","だし"]},
{n:"豚の生姜焼き",e:"🐷",t:"時短",k:true,d:"15分でできる！",i:["豚ロース","玉ねぎ","生姜"],s:["醤油","みりん","酒","砂糖"]},
{n:"麻婆豆腐",e:"🌶️",t:"時短",k:false,d:"辛さ控えめなら子どもも○",i:["豆腐","豚ひき肉","長ネギ","にんにく","生姜"],s:["豆板醤","甜麺醤","醤油","ごま油","鶏がらスープ","片栗粉"]},
{n:"鮭のムニエル",e:"🐟",t:"時短",k:true,d:"切り身で簡単",i:["鮭の切り身","レモン"],s:["バター","塩","こしょう","小麦粉"]},
{n:"ハンバーグ",e:"🍔",t:"普通",k:true,d:"こねて焼くだけ",i:["合いびき肉","玉ねぎ","卵","牛乳"],s:["パン粉","塩","こしょう","ナツメグ","ケチャップ","ウスターソース"]},
{n:"鶏の照り焼き",e:"🍗",t:"時短",k:true,d:"フライパン一つで",i:["鶏もも肉","生姜"],s:["醤油","みりん","酒","砂糖","サラダ油"]},
{n:"餃子",e:"🥟",t:"普通",k:true,d:"市販の皮で簡単",i:["豚ひき肉","キャベツ","にら","にんにく","生姜","餃子の皮"],s:["醤油","ごま油","酒","塩","こしょう"]},
{n:"オムライス",e:"🍳",t:"時短",k:true,d:"子どもに大人気！",i:["卵","ご飯","鶏もも肉","玉ねぎ"],s:["ケチャップ","バター","塩","こしょう"]},
{n:"チキンカレー",e:"🍛",t:"時短",k:true,d:"ルーを使えば簡単",i:["鶏もも肉","玉ねぎ","じゃがいも","にんじん"],s:["カレールー","サラダ油","塩","こしょう"]},
{n:"豆腐ステーキ",e:"🫘",t:"時短",k:true,d:"ヘルシー＆コスパ抜群",i:["木綿豆腐","にんにく"],s:["バター","醤油","みりん","片栗粉","サラダ油"]},
{n:"塩サバ焼き",e:"🐟",t:"時短",k:true,d:"グリルに入れるだけ",i:["塩サバ"],s:["大根おろし","醤油","スダチ（あれば）"]},
{n:"豚バラ大根",e:"🥩",t:"普通",k:true,d:"圧力鍋で時短も◎",i:["豚バラ肉","大根","生姜"],s:["醤油","みりん","酒","砂糖","だし"]},
{n:"鶏つくね",e:"🍡",t:"時短",k:true,d:"甘辛タレで子どもも大好き",i:["鶏ひき肉","長ネギ","卵","生姜"],s:["醤油","みりん","砂糖","酒","片栗粉"]},
{n:"チキンソテー",e:"🍗",t:"時短",k:true,d:"塩レモンで爽やか",i:["鶏もも肉","レモン","にんにく"],s:["塩","こしょう","オリーブオイル","バター"]},
{n:"海老チリ",e:"🦐",t:"時短",k:false,d:"ケチャップ味で挑戦",i:["えび","長ネギ","にんにく","生姜"],s:["ケチャップ","豆板醤","酒","砂糖","塩","片栗粉","サラダ油"]},
{n:"豚キムチ炒め",e:"🌶️",t:"時短",k:false,d:"辛さ調整で大人向け",i:["豚バラ肉","キムチ","豆腐"],s:["ごま油","醤油","酒"]},
{n:"鶏そぼろ丼",e:"🍚",t:"時短",k:true,d:"三色丼にしても◎",i:["鶏ひき肉","卵","ご飯","生姜"],s:["醤油","みりん","砂糖","酒"]},
{n:"豚汁",e:"🥣",t:"時短",k:true,d:"具だくさんで満足感UP",i:["豚バラ肉","大根","にんじん","玉ねぎ","こんにゃく"],s:["みそ","だし","ごま油","酒"]},
{n:"鶏むね肉のピカタ",e:"🍗",t:"時短",k:true,d:"子どもが食べやすい！",i:["鶏むね肉","卵","粉チーズ"],s:["塩","こしょう","小麦粉","オリーブオイル"]},
];
const SM=[
{n:"ほうれん草のおひたし",e:"🌿",t:"時短",k:true,d:"レンジで2分",i:["ほうれん草"],s:["だし","醤油","みりん","ごま"]},
{n:"ポテトサラダ",e:"🥔",t:"普通",k:true,d:"作り置きに最適",i:["じゃがいも","玉ねぎ","にんじん","ハム","きゅうり"],s:["マヨネーズ","塩","こしょう","酢"]},
{n:"きんぴらごぼう",e:"🥕",t:"時短",k:true,d:"作り置きOK",i:["ごぼう","にんじん"],s:["醤油","みりん","砂糖","ごま油","ごま","唐辛子"]},
{n:"だし巻き卵",e:"🥚",t:"時短",k:true,d:"毎日食べても飽きない",i:["卵"],s:["だし","醤油","みりん","サラダ油"]},
{n:"もやし炒め",e:"🌱",t:"時短",k:true,d:"5分で完成！",i:["もやし","にんにく"],s:["ごま油","醤油","塩","こしょう"]},
{n:"トマトとモッツァレラ",e:"🍅",t:"時短",k:true,d:"切るだけ！",i:["トマト","モッツァレラチーズ"],s:["オリーブオイル","塩","こしょう","バジル"]},
{n:"ブロッコリーのゴマ和え",e:"🥦",t:"時短",k:true,d:"レンジで時短",i:["ブロッコリー"],s:["ごま","醤油","砂糖","みりん"]},
{n:"冷ややっこ",e:"🫘",t:"時短",k:true,d:"カットして乗せるだけ",i:["絹豆腐","長ネギ","生姜"],s:["醤油","かつお節","ごま油（お好みで）"]},
{n:"ひじきの煮物",e:"🌊",t:"普通",k:true,d:"作り置き推奨",i:["ひじき","にんじん","油揚げ"],s:["醤油","みりん","砂糖","だし","ごま油"]},
{n:"コーンバター炒め",e:"🌽",t:"時短",k:true,d:"子どもが大好き！",i:["コーン（缶）"],s:["バター","醤油","塩","こしょう"]},
{n:"かぼちゃの煮物",e:"🎃",t:"普通",k:true,d:"レンジで簡単",i:["かぼちゃ"],s:["醤油","みりん","砂糖","だし"]},
{n:"えのきのバター醤油",e:"🍄",t:"時短",k:true,d:"フライパン3分",i:["えのき"],s:["バター","醤油","塩","こしょう","青ネギ"]},
{n:"アボカドサラダ",e:"🥑",t:"時短",k:true,d:"混ぜるだけ",i:["アボカド","トマト","玉ねぎ"],s:["オリーブオイル","レモン汁","塩","こしょう"]},
{n:"卵スープ",e:"🥣",t:"時短",k:true,d:"溶くだけで簡単",i:["卵","長ネギ"],s:["鶏がらスープの素","ごま油","塩","こしょう"]},
{n:"ナムル三種",e:"🥗",t:"普通",k:true,d:"作り置きに最適",i:["もやし","ほうれん草","にんじん"],s:["ごま油","塩","にんにく","ごま","醤油"]},
{n:"枝豆",e:"🫘",t:"時短",k:true,d:"茹でるだけ！",i:["枝豆"],s:["塩"]},
{n:"れんこんのきんぴら",e:"🌰",t:"普通",k:true,d:"シャキシャキ食感",i:["れんこん"],s:["醤油","みりん","ごま油","ごま","唐辛子"]},
{n:"小松菜と油揚げの煮浸し",e:"🌿",t:"時短",k:true,d:"だしで旨味たっぷり",i:["小松菜","油揚げ"],s:["だし","醤油","みりん"]},
{n:"きゅうりの浅漬け",e:"🥒",t:"時短",k:true,d:"塩もみだけ！",i:["きゅうり","生姜"],s:["塩","ごま","酢（お好みで）"]},
{n:"長芋の梅あえ",e:"🌾",t:"時短",k:true,d:"さっぱり食べやすい",i:["長芋","梅干し"],s:["醤油","かつお節","みりん"]},
];

let mode='r',ings=[],lm=null,ls1=null,ls2=null,busy=false;
let cardData={mc:null,sc1:null,sc2:null};
let expanded={mc:false,sc1:false,sc2:false};

function setMode(m){
  mode=m;
  document.getElementById('brnd').classList.toggle('on',m==='r');
  document.getElementById('bing').classList.toggle('on',m==='i');
  document.getElementById('iarea').style.display=m==='i'?'flex':'none';
  lm=null;ls1=null;ls2=null;
  cardData={mc:null,sc1:null,sc2:null};
  expanded={mc:false,sc1:false,sc2:false};
  document.getElementById('mc').innerHTML='<span class="cph">ガチャを回してね！</span>';
  document.getElementById('sc1').innerHTML='<span class="cph">副菜①</span>';
  document.getElementById('sc2').innerHTML='<span class="cph">副菜②</span>';
  document.getElementById('rm').disabled=true;
  document.getElementById('rs1').disabled=true;
  document.getElementById('rs2').disabled=true;
  document.getElementById('nomatch').style.display='none';
}
function addIng(){
  const inp=document.getElementById('iinput');
  const v=inp.value.trim();if(!v)return;
  v.split(/[、,，\s]+/).filter(x=>x).forEach(w=>{if(!ings.includes(w))ings.push(w);});
  inp.value='';renderTags();
}
function delIng(i){ings.splice(i,1);renderTags();}
function renderTags(){
  document.getElementById('tagbox').innerHTML=ings.map((g,i)=>
    `<span class="tag">${g}<button class="tdel" onclick="delIng(${i})">×</button></span>`
  ).join('');
}
function scoreItem(item){
  if(!ings.length)return 0;
  const ii=[...item.i,...item.s].map(s=>s.toLowerCase());
  let sc=0;
  ings.forEach(u=>{const ul=u.toLowerCase();if(ii.some(x=>x.includes(ul)||ul.includes(x)))sc++;});
  return sc;
}
function pick(arr,excl1,excl2){
  excl2=excl2||null;
  if(mode==='r'||!ings.length){
    const p=arr.filter(x=>x!==excl1&&x!==excl2);
    return p.length?p[Math.floor(Math.random()*p.length)]:null;
  }
  const sc=arr.filter(x=>x!==excl1&&x!==excl2).map(x=>({x,s:scoreItem(x)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!sc.length)return null;
  const best=sc[0].s;
  const top=sc.filter(x=>x.s===best);
  return top[Math.floor(Math.random()*top.length)].x;
}
function matched(item){
  if(!ings.length)return[];
  return ings.filter(u=>item.i.some(x=>x.toLowerCase().includes(u.toLowerCase())||u.toLowerCase().includes(x.toLowerCase())));
}
function buildCardHTML(item,small,isExpanded){
  const m=matched(item);
  const bs=[];
  if(item.t==='時短')bs.push('<span class="b bq">⏱ 時短</span>');
  if(item.k)bs.push('<span class="b bk">👶 OK</span>');
  if(m.length)bs.push(`<span class="b bi">🧊 ${m.join('・')}</span>`);
  const nmClass=small?'cnm':'cnm cnm-main';
  let html=`<span class="cej">${item.e}</span><div class="${nmClass}">${item.n}</div><div class="cbdg">${bs.join('')}</div><div class="cnt">${item.d}</div>`;
  if(m.length)html+=`<div class="cmt">${m.join('、')}</div>`;
  if(isExpanded){
    html+=`<div class="detail"><div class="detail-title">📋 材料・調味料</div><div class="detail-section"><div class="detail-label">食材</div><div class="detail-items">${item.i.map(x=>`<span class="detail-tag detail-ing">${x}</span>`).join('')}</div></div><div class="detail-section"><div class="detail-label">調味料</div><div class="detail-items">${item.s.map(x=>`<span class="detail-tag detail-sea">${x}</span>`).join('')}</div></div></div>`;
  }else{
    html+=`<div class="tap-hint">タップで材料を見る ▼</div>`;
  }
  return html;
}
function showCard(id,item,small){
  const el=document.getElementById(id);
  el.classList.remove('rev','expanded');void el.offsetWidth;el.classList.add('rev');
  expanded[id]=false;cardData[id]={item,small};
  el.innerHTML=buildCardHTML(item,small,false);
}
function toggleDetail(id){
  if(!cardData[id])return;
  const el=document.getElementById(id);
  expanded[id]=!expanded[id];
  el.classList.toggle('expanded',expanded[id]);
  const{item,small}=cardData[id];
  el.innerHTML=buildCardHTML(item,small,expanded[id]);
}
function spin(id,delay,cb){
  const el=document.getElementById(id);
  el.classList.remove('rev','expanded');expanded[id]=false;
  el.innerHTML='<span class="spn">🎲</span>';
  setTimeout(cb,delay);
}
function setBusy(b){
  busy=b;
  document.getElementById('gbtn').disabled=b;
  document.getElementById('rm').disabled=b||(lm===null);
  document.getElementById('rs1').disabled=b||(ls1===null);
  document.getElementById('rs2').disabled=b||(ls2===null);
}
function roll(){
  if(busy)return;
  document.getElementById('nomatch').style.display='none';
  setBusy(true);
  document.getElementById('gbtn').textContent='🎲 回してる...';
  spin('mc',500,()=>{
    const it=pick(MM,lm,null);
    if(it){showCard('mc',it,false);lm=it;}
    else document.getElementById('mc').innerHTML='<span class="cph">マッチなし…</span>';
  });
  spin('sc1',700,()=>{
    const it=pick(SM,ls1,ls2);
    if(it){showCard('sc1',it,true);ls1=it;}
    else document.getElementById('sc1').innerHTML='<span class="cph">マッチなし…</span>';
  });
  spin('sc2',950,()=>{
    const it=pick(SM,ls2,ls1);
    if(it){showCard('sc2',it,true);ls2=it;}
    else document.getElementById('sc2').innerHTML='<span class="cph">マッチなし…</span>';
    document.getElementById('gbtn').textContent='🎰 ガチャを回す！';
    setBusy(false);
  });
}
function reroll(t){
  if(busy)return;setBusy(true);
  if(t==='m'){spin('mc',450,()=>{const it=pick(MM,lm,null);if(it){showCard('mc',it,false);lm=it;}setBusy(false);});}
  else if(t==='s1'){spin('sc1',450,()=>{const it=pick(SM,ls1,ls2);if(it){showCard('sc1',it,true);ls1=it;}setBusy(false);});}
  else{spin('sc2',450,()=>{const it=pick(SM,ls2,ls1);if(it){showCard('sc2',it,true);ls2=it;}setBusy(false);});}
}
</script>
